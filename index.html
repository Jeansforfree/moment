<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>azworld · 个人主页</title>
<style>
  :root {
    --bg: #ffffff; --text: #1a1a1a; --text-light: #666666;
    --blue: #4a6fa5; --blue-light: #eef3fa; --border: #e5e7eb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; max-width: 800px; margin: 0 auto; padding: 40px 20px 80px; }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; font-size: 0.9rem; }
  .nav-logo { font-weight: 700; }
  .nav-links a { color: var(--text-light); margin-left: 20px; }

  .hero { text-align: center; margin-bottom: 60px; }
  .avatar { width: 100px; height: 100px; border-radius: 50%; background: var(--blue-light); margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--blue); overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .hero h1 { font-size: 1.8rem; margin-bottom: 8px; }
  .hero .info { color: var(--text-light); font-size: 0.9rem; margin-bottom: 16px; display: flex; justify-content: center; gap: 16px; }

  h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .about { margin-bottom: 60px; font-size: 0.95rem; color: var(--text-light); }
  .about p { margin-bottom: 12px; }

  /* 文章列表 */
  .posts { margin-bottom: 60px; }
  .post-item { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .post-item:hover { background: var(--blue-light); }
  .post-item .date { font-size: 0.85rem; color: var(--text-light); width: 110px; flex-shrink: 0; }
  .post-item .title { font-size: 0.95rem; font-weight: 500; flex-grow: 1; }
  .post-item .arrow { color: var(--text-light); }

  /* 阅读页面（点击文章后才显示） */
  .article-view { display: none; }
  .article-view.active { display: block; }
  .article-view .back { background: none; border: none; color: var(--blue); cursor: pointer; margin-bottom: 20px; font-size: 0.9rem; }
  .article-view h1 { font-size: 1.5rem; margin-bottom: 10px; line-height: 1.4; }
  .article-view .meta { font-size: 0.85rem; color: var(--text-light); margin-bottom: 30px; }
  .article-content { font-size: 0.95rem; line-height: 1.9; color: #333; }
  .article-content img { max-width: 100%; border-radius: 8px; margin: 16px 0; }

  footer { text-align: center; font-size: 0.8rem; color: var(--text-light); border-top: 1px solid var(--border); padding-top: 30px; }
  @media (max-width: 600px) { .post-item { flex-direction: column; align-items: flex-start; gap: 6px; } .post-item .date { width: auto; } }
</style>
</head>
<body>

<nav>
  <div class="nav-logo">azworld</div>
  <div class="nav-links">
    <a href="#about">关于</a>
    <a href="#posts">文章</a>
  </div>
</nav>

<div class="hero">
  <div class="avatar">A</div>
  <h1>azworld</h1>
  <div class="info"><span>📍 中国</span><span>🔗 GitHub</span></div>
</div>

<div id="listView">
  <div class="about" id="about">
    <h2>关于我</h2>
    <p>你好，我是 azworld。</p>
    <p>这里是我记录生活和写文章的地方。你可以在这里随便逛逛。</p>
  </div>

  <div class="posts" id="posts">
    <h2>文章</h2>
    <div id="postList"></div>
  </div>
</div>

<!-- 阅读文章页面（隐藏状态） -->
<div class="article-view" id="articleView">
  <button class="back" onclick="closeArticle()">← 返回文章列表</button>
  <h1 id="artTitle"></h1>
  <div class="meta" id="artMeta"></div>
  <div class="article-content" id="artContent"></div>
</div>

<footer>© 2026 azworld</footer>

<!-- 引入 Markdown 解析工具，把后台写的文章变成网页格式 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
let posts = [];

// 加载文章数据
async function loadPosts() {
  try {
    const res = await fetch('content/posts.json');
    const data = await res.json();
    posts = data.posts || [];
  } catch (e) { posts = []; }
  renderList();
}

// 渲染文章列表
function renderList() {
  const listEl = document.getElementById('postList');
  if (posts.length === 0) {
    listEl.innerHTML = '<p style="color:#999;font-size:0.9rem;">还没有文章，敬请期待…</p>';
    return;
  }
  listEl.innerHTML = posts.map((p, i) => `
    <div class="post-item" onclick="openArticle(${i})">
      <span class="date">${p.date}</span>
      <span class="title">${p.title}</span>
      <span class="arrow">→</span>
    </div>
  `).join('');
}

// 点击阅读全文
function openArticle(idx) {
  const p = posts[idx];
  document.getElementById('listView').style.display = 'none';
  document.getElementById('articleView').classList.add('active');
  document.getElementById('artTitle').innerText = p.title;
  document.getElementById('artMeta').innerText = p.date;
  // 把 Markdown 格式的文章变成网页格式
  document.getElementById('artContent').innerHTML = marked.parse(p.body || '');
  window.scrollTo(0, 0);
}

function closeArticle() {
  document.getElementById('articleView').classList.remove('active');
  document.getElementById('listView').style.display = 'block';
}

loadPosts();
</script>
</body>
</html>
